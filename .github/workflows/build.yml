name: Build

on:
  push:
    branches: [main, rust-rewrite]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact toolchain; rustup installs it on first use.
      - name: Show toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Hardware tests are #[ignore]d and never run in CI; nothing here contacts a device.
      - name: Test
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --release --locked -p winpods -p winpods-cli

      - uses: actions/upload-artifact@v4
        with:
          name: WinPods-windows-x64
          path: |
            target/release/WinPods.exe
            target/release/winpods-cli.exe

      - uses: actions/upload-artifact@v4
        with:
          name: WinPods-pdb
          path: target/release/*.pdb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches the workspace version
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'winpods').version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match workspace version $version"
          }

      - name: Build
        run: cargo build --release --locked -p winpods -p winpods-cli -p winpods-sign

      - name: Third-party notices
        shell: pwsh
        run: |
          cargo install cargo-about --locked --features cli --version 0.9.3
          cargo about generate --workspace about.hbs -o notices-raw.html
          python tools/notices.py notices-raw.html THIRD-PARTY-NOTICES.html

      - name: Package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          New-Item -ItemType Directory -Force out, pkg\WinPods | Out-Null
          Copy-Item target\release\WinPods.exe, target\release\winpods-cli.exe, README.md, LICENSE, THIRD-PARTY-NOTICES.html pkg\WinPods\
          Compress-Archive -Path pkg\WinPods -DestinationPath "out\WinPods-$tag-windows-x64.zip"
          Copy-Item target\release\WinPods.exe, target\release\winpods-cli.exe out\
          $lines = Get-ChildItem out -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [IO.File]::WriteAllText("$PWD\out\SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content out\SHA256SUMS.txt

      - name: Sign SHA256SUMS.txt
        shell: pwsh
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if (-not $env:MINISIGN_SECRET_KEY) {
            Write-Output "::warning::MINISIGN_SECRET_KEY is not set; publishing without a signature (auto-update will only offer the release page)"
            exit 0
          }
          $comment = "WinPods $($env:GITHUB_REF_NAME) windows-x64"
          target\release\winpods-sign.exe sign - out\SHA256SUMS.txt $comment
          $pub = (Get-Content keys\winpods-update.pub | Where-Object { $_ -notmatch '^untrusted comment' -and $_.Trim() })[0]
          target\release\winpods-sign.exe verify $pub out\SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem out -File | ForEach-Object { $_.FullName }
          gh release create $tag @files --title "WinPods $tag" --generate-notes
