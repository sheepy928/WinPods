name: Build

on:
  push:
    branches: [main, rust-rewrite]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact toolchain; rustup installs it on first use.
      - name: Show toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Hardware tests are #[ignore]d and never run in CI; nothing here contacts a device.
      - name: Test
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --release --locked -p winpods -p winpods-cli

      - uses: actions/upload-artifact@v4
        with:
          name: WinPods-windows-x64
          path: |
            target/release/WinPods.exe
            target/release/winpods-cli.exe

      - uses: actions/upload-artifact@v4
        with:
          name: WinPods-pdb
          path: target/release/*.pdb
